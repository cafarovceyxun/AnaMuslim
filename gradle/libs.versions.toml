[versions]
coreKtx = "1.13.1"
espressoCore = "3.7.0"
gradle = "9.3.2"
composeMultiplatform = "1.11.1"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.3.20"
# Must stay >= the ktor-client-core that supabase-kt pulls in transitively (3.6.0 → ktor 3.4.3).
# Ktor engines use `@InternalAPI` core functions and are only supported against a core of the *same*
# version: while this said 3.0.1, Gradle upgraded `ktor-client-core` to supabase's 3.0.3 (highest
# wins) but left `ktor-client-darwin` at 3.0.1, so iOS ran a mismatched engine. The single ref below
# keeps both engines (Darwin + OkHttp) locked to whatever core version supabase-kt requires.
ktor = "3.4.3"
lifecycle = "2.8.7"
# JetBrains multiplatform lifecycle (native/iOS publications). Matches the version CMP 1.8.2 already
# resolves androidx.lifecycle to on iOS; used for the shared `viewModel()` compose helper.
jetbrainsLifecycle = "2.8.4"
# JetBrains multiplatform navigation (native/iOS publications). `androidx.navigation:navigation-compose`
# (Google group, see `compose-navigation` below) does NOT publish iOS artifacts — same trap as
# lifecycle-viewmodel-compose above. The app module keeps its androidx dependency untouched.
jetbrainsNavigation = "2.9.2"
desugaring = "2.1.4"
annotation = "1.9.1"
legacySupport = "1.0.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
apacheCommons = "3.12.0"
guava = "32.0.1-jre"
webkit = "1.12.1"
media = "1.7.0"
viewbinding = "8.8.0"
browser = "1.8.0"
exoplayer = "2.19.1"
media3 = "1.5.1"
retrofit = "3.0.0"
kotlinxSerialization = "1.10.0"
kotlinxCoroutines = "1.10.1"
kotlinxRetrofit = "0.8.0"
commonsCompress = "1.24.0"
workManager = "2.8.1"
composeBom = "2024.12.01"
# `LineHeightStyle.Mode.Tight` (shared `tightTextStyle` Android actual) only exists in ui-text 1.10+.
# The app already resolves 1.10.0 transitively; this pins the shared module's Android target to the
# same version, which would otherwise settle on 1.9.0 and fail to compile the actual.
composeUiText = "1.10.0"
composeMaterialIconsExtended = "1.7.6"
dataStore = "1.1.7"
activityKtx = "1.9.3"
fragmentKtx = "1.8.5"
room = "2.8.4"
sqlite = "2.6.2"
ksp = "2.3.10"
okio = "3.9.1"
paging = "3.4.2"
splashscreen = "1.0.1"

compose-navigation = "2.8.5"
navigation-fragment-ktx = "2.8.5"
navigation-ui-ktx = "2.8.5"

glance = "1.1.1"
# Pinned to a supabase-kt built against kotlinx-datetime **0.7.1** — the version Compose
# Multiplatform material3 1.9.0 drags in and therefore what Gradle resolves. 3.1.1 was built against
# 0.6.1, whose `kotlinx.datetime.serializers.InstantIso8601Serializer` no longer exists in 0.7.x:
# on Android the JVM still resolved it, but Kotlin/Native failed at runtime the moment an auth
# session was deserialized ("No class found for symbol ...InstantIso8601Serializer"). Nothing caught
# it at compile time. Do not bump to 3.7.x without also checking material3: it wants datetime 0.8.0.
supabase = "3.6.0"


[libraries]
# Compose Multiplatform common BackHandler (androidx.compose.ui.backhandler). compose.ui pulls it
# transitively on iOS but not on Android, so it is declared explicitly for commonMain.
compose-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "composeMultiplatform" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-coreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Multiplatform (JetBrains) variant of the above — publishes iOS/native targets for shared commonMain.
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
# KMP core ViewModel (androidx.lifecycle.ViewModel + viewModelScope) for shared commonMain view models.
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
# Multiplatform (JetBrains) variant of androidx.lifecycle:lifecycle-runtime-compose — publishes iOS
# targets. `collectAsStateWithLifecycle` for shared composables.
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
# Multiplatform (JetBrains) variant of `compose-navigation` — publishes iOS/native targets.
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigation" }

androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-legacySupport = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupport" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
desugaring = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugaring" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
apache-commons = { group = "org.apache.commons", name = "commons-lang3", version.ref = "apacheCommons" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
viewbinding = { group = "com.android.databinding", name = "viewbinding", version.ref = "viewbinding" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-activityKtx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityKtx" }
androidx-fragmentKtx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }

# ExoPlayer
exoplayerCore = { module = "com.google.android.exoplayer:exoplayer-core", version.ref = "exoplayer" }
exoplayerUI = { module = "com.google.android.exoplayer:exoplayer-ui", version.ref = "exoplayer" }
extensionMediasession = { module = "com.google.android.exoplayer:extension-mediasession", version.ref = "exoplayer" }

# AndroidX Media3
media3ExoPlayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3Datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3Database = { module = "androidx.media3:media3-database", version.ref = "media3" }
media3Session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3UI = { module = "androidx.media3:media3-ui", version.ref = "media3" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
kotlinxSerialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxCoroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxRetrofit = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "kotlinxRetrofit" }

commonsCompress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
workManager = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

dataStore = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "composeUiText" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-windowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIconsExtended" }
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

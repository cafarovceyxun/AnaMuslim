name: Uptime

# Öz serverimizin (Oracle, self-hosted Supabase) sağlamlıq yoxlaması.
# Uğursuz işə düşmə GitHub-un standart bildirişi ilə e-poçta gedir (Settings → Notifications → Actions).
# ⚠️ Public repoda 60 gün commit olmasa GitHub planlı workflow-ları söndürür — e-poçtla xəbər verir,
# «Enable workflow» ilə yenidən açılır.

on:
  schedule:
    # ⚠️ GitHub planlı işləri «imkan olduqca» işlədir. `*/15` (:00/:15/:30/:45) ən yüklü dəqiqələrə düşürdü və
    # 2026-11-11-də ölçüldü: gündə 96 əvəzinə 3–4 işə düşmə, aralarında 4–10 saat. Ona görə dəqiqələr
    # sürüşdürülüb. Bu, zəmanət deyil — «Actions» səhifəsində işə düşmə vaxtlarına bax; yenə seyrəkdirsə
    # kənar tətikləyici lazımdır (`workflow_dispatch`-i çağıran cron: Cloudflare Worker və ya pg_cron + token).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (anon açarı SupabaseProvider.kt-dən oxunur)
        uses: actions/checkout@v4
        with:
          sparse-checkout: shared/src/commonMain/kotlin/com/cafarovceyxun/anamuslim/utils/supabase/SupabaseProvider.kt
          sparse-checkout-cone-mode: false

      - name: API, auth, funksiyalar, sertifikat
        shell: bash
        run: |
          set -uo pipefail
          F=shared/src/commonMain/kotlin/com/cafarovceyxun/anamuslim/utils/supabase/SupabaseProvider.kt
          BASE=$(grep -oE 'SUPABASE_URL = "[^"]+"' "$F" | cut -d'"' -f2)
          KEY=$(grep -oE 'SUPABASE_KEY = "[^"]+"' "$F" | cut -d'"' -f2)
          HOST=${BASE#https://}
          fail=0
          check() { # ad, gözlənilən kod, url
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$3")
            if [ "$code" = "$2" ]; then echo "OK   $1 ($code)"; else echo "FAIL $1: $code, gözlənilən $2"; fail=1; fi
          }
          check "REST (app_releases)" 200 "$BASE/rest/v1/app_releases?select=platform"
          check "Auth" 200 "$BASE/auth/v1/health"
          check "Storage" 200 "$BASE/storage/v1/version"
          check "Qiblə taylı" 200 "$BASE/functions/v1/qibla-tiles/street/0/0/0"
          # Qari səsi keçidi (Caddy → quranicaudio): tətbiq 11 qarinin səsini buradan alır.
          check "Qari səsi (download)" 200 "$BASE/qari/download/quran/badr_al_turki/mp3/112.mp3"
          check "Qari səsi (mirrors)" 200 "$BASE/qari/mirrors/tvquran/maher_al_mu3aiqly/112.mp3"
          rows=$(curl -s --max-time 20 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE/rest/v1/app_releases?select=platform" | grep -o platform | wc -l)
          [ "$rows" -ge 2 ] && echo "OK   data: app_releases $rows sətir" || { echo "FAIL data: app_releases $rows sətir"; fail=1; }
          end=$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          [ "$days" -ge 14 ] && echo "OK   sertifikat: $days gün qalıb" || { echo "FAIL sertifikat: $days gün qalıb (Caddy yeniləyə bilmir?)"; fail=1; }
          exit $fail

      # Ehtiyat: Supabase Frankfurt yalnız cədvəllərin gecəlik nüsxəsidir (Oracle-da
      # anamuslim-backup-sync.timer, 03:15 UTC). Köçürmə dayansa (məs. Oracle-da sxem dəyişib,
      # ehtiyatda yox) burada tutulur. Gecəlik yedəyin özü yarımçıq qalanda da (məs. serverdən kənar
      # yükləmə alınmadı) sinxron `synced_at`-ı yeniləmir — yəni bu yoxlama onu da tutur. Sorğu həm də pulsuz layihəni «aktivsiz» dondurulmaqdan saxlayır.
      - name: Ehtiyat nüsxəsinin təzəliyi
        shell: bash
        run: |
          set -uo pipefail
          BASE=https://vyacxuwhtqqbythsovzt.supabase.co
          KEY=sb_publishable_AK_a6SILFQHpLeuSOJR5lA_6jxZd3_v
          at=$(curl -s --max-time 20 --retry 2 -H "apikey: $KEY" "$BASE/rest/v1/backup_sync_status?select=synced_at" \
            | grep -oE '"synced_at":"[^"]+"' | cut -d'"' -f4)
          [ -n "$at" ] || { echo "FAIL ehtiyat: synced_at oxunmadı"; exit 1; }
          hours=$(( ( $(date +%s) - $(date -d "$at" +%s) ) / 3600 ))
          [ "$hours" -le 26 ] && echo "OK   ehtiyat: $hours saat əvvəl köçürülüb" \
            || { echo "FAIL ehtiyat: son köçürmə $hours saat əvvəl ($at) — journalctl -u anamuslim-backup-sync -u anamuslim-backup"; exit 1; }
